<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: min(90vw, 405px);
            margin: 20px auto;
            border: 2px solid #333;
        }
        input {
            width: 100%;
            min-width: 0;
            aspect-ratio: 1;
            box-sizing: border-box;
            text-align: center;
            font-size: 20px;
            border: 1px solid #bbb;
            color: #2563eb;
        }
        input[readonly] {
            background: #dce4ee;
            color: #222;
            font-weight: bold;
        }
        input.wrong { background: #ffcaca; }
        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #184cb5; }
    </style>
</head>
<body>
    <h1>Sudoku</h1>
    <p>T\u00e4ida t\u00fchjad ruudud numbritega 1\u20139.</p>
    <div id="board"></div>
    <button onclick="check()">Kontrolli</button>
    <button onclick="start()">Alusta uuesti</button>
    <p id="message" role="status"></p>

    <script>
        // 0 t\u00e4histab t\u00fchja ruutu
        const puzzle = [
            '530070000',
            '600195000',
            '098000060',
            '800060003',
            '400803001',
            '700020006',
            '060000280',
            '000419005',
            '000080079'
        ].join('');

        const solution = [
            '534678912',
            '672195348',
            '198342567',
            '859761423',
            '426853791',
            '713924856',
            '961537284',
            '287419635',
            '345286179'
        ].join('');

        const board = document.getElementById('board');
        const message = document.getElementById('message');

        function start() {
            board.innerHTML = '';
            message.textContent = '';

            for (let i = 0; i < 81; i++) {
                const cell = document.createElement('input');
                cell.maxLength = 1;
                cell.inputMode = 'numeric';
                cell.setAttribute('aria-label', `Rida ${Math.floor(i / 9) + 1}, veerg ${i % 9 + 1}`);

                if (puzzle[i] !== '0') {
                    cell.value = puzzle[i];
                    cell.readOnly = true;
                }

                // Paksemad jooned 3 \u00d7 3 plokkide vahel
                if (i % 9 === 2 || i % 9 === 5) {
                    cell.style.borderRight = '2px solid #333';
                }
                if (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5) {
                    cell.style.borderBottom = '2px solid #333';
                }

                cell.oninput = () => {
                    cell.value = cell.value.replace(/[^1-9]/g, '');
                    cell.classList.remove('wrong');
                    message.textContent = '';
                };
                board.appendChild(cell);
            }
        }

        function check() {
            const cells = board.querySelectorAll('input');
            let correct = true;

            cells.forEach((cell, i) => {
                const wrong = cell.value !== solution[i];
                cell.classList.toggle('wrong', wrong && cell.value !== '');
                if (wrong) correct = false;
            });

            message.textContent = correct
                ? 'Tubli! Lahendasid Sudoku! \ud83c\udf89'
                : 'M\u00f5ni number on vale v\u00f5i puudu!';
        }

        start();
    </script>
</body>
</html>
